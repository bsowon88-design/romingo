name: 재난 자료 자동 수집

on:
  schedule:
    - cron: '7 * * * *' # 1시간마다 (매시 7분)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50 # 마지막으로 사이트를 다시 만든 때를 알려고 최근 기록까지 받음
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공식 데이터 모으기
        run: node scripts/collect.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      - name: 바뀐 것만 올리기
        run: |
          git config user.name "romingo-bot"
          git config user.email "romingo-bot@users.noreply.github.com"
          git add src/data/archive
          if git diff --cached --quiet; then ARCH=0; else ARCH=1; fi
          git add live
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          # Cloudflare 무료 빌드는 한 달 500번 — 사이트는 3시간에 한 번만 다시 만듦
          # (마지막으로 다시 만든 지 2시간 50분이 안 됐으면 자료만 저장해 두고, 다음 빌드 때 한꺼번에 반영)
          LAST=$(git log -1 --format=%ct --invert-grep --grep='skip ci' || echo 0)
          AGO=$(( $(date +%s) - ${LAST:-0} ))
          if [ "$ARCH" = "1" ] && [ "$AGO" -ge 10200 ]; then
            git commit -m "자동: 재난 자료 갱신"
          elif [ "$ARCH" = "1" ]; then
            echo "마지막 빌드 $((AGO / 60))분 전 — 자료만 저장"
            git commit -m "자동: 자료 저장 [skip ci]"
          else
            # 운항 현황·예보만 바뀌면 사이트는 다시 만들지 않음 (화면이 바로 불러옴)
            git commit -m "자동: 운항·예보 갱신 [skip ci]"
          fi
          # 다른 실행과 겹쳐 충돌하면 이번 것은 올리지 않고 다음 시간에 다시 (자료는 다음 수집 때 다시 받음)
          if ! git pull --rebase -X theirs; then
            git rebase --abort || true
            echo "다른 실행과 겹침 — 다음 시간에 다시"
            exit 0
          fi
          git push

name: 재난 자료 자동 수집

on:
  schedule:
    - cron: '7 * * * *' # 1시간마다 (매시 7분)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 공식 데이터 모으기
        run: node scripts/collect.mjs
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
      - name: 바뀐 것만 올리기
        run: |
          git config user.name "romingo-bot"
          git config user.email "romingo-bot@users.noreply.github.com"
          git add src/data/archive
          if git diff --cached --quiet; then ARCH=0; else ARCH=1; fi
          git add live
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"
            exit 0
          fi
          if [ "$ARCH" = "1" ]; then
            git commit -m "자동: 재난 자료 갱신"
          else
            # 운항 현황·예보만 바뀌면 사이트는 다시 만들지 않음 (화면이 바로 불러옴)
            git commit -m "자동: 운항·예보 갱신 [skip ci]"
          fi
          git pull --rebase
          git push
